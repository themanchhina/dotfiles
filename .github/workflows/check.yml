name: Check Flake

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: true

      # No `nix flake check`: it skips darwinConfigurations, so these evals are the
      # only thing that catches module errors. Restore it if a checks/packages
      # output is ever added, since nothing else would gate one.
      # Both profiles: the home lists in darwin.nix are otherwise never evaluated.
      - name: Evaluate darwin configuration
        run: |
          for p in work home; do
            echo "--- profile=$p"
            DOTFILES_PROFILE="$p" nix eval --impure --raw \
              "path:.#darwinConfigurations.default.config.system.build.toplevel.drvPath" >/dev/null
          done

      # mkOutOfStoreSymlink takes a string, so a renamed config/ file evaluates
      # fine and only shows up as a dangling symlink in $HOME.
      - name: Verify every managed link source exists
        run: |
          grep -o '= link "[^"]*"' home.nix | sed 's/.*link "//; s/"$//' | while read -r p; do
            test -e "$p" || { echo "missing link source: $p"; exit 1; }
          done

      - name: Validate shell scripts syntax
        run: for f in scripts/*.sh scripts/lib/*.sh; do bash -n "$f"; done

      # The macOS runner images ship no shellcheck; nix is already installed above.
      - name: Lint shell scripts
        run: nix run nixpkgs/nixos-26.05#shellcheck -- --severity=warning scripts/*.sh scripts/lib/*.sh

      - name: Run regression checks
        run: |
          nix shell --inputs-from . nixpkgs#neovim nixpkgs#jq nixpkgs#fzf nixpkgs#direnv --command \
            python3 -m unittest discover -s tests -v
