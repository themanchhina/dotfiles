name: Check Flake

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Check flake evaluation
        run: nix flake check --impure "path:." --no-build

      # flake check skips darwinConfigurations; only an eval catches module errors.
      - name: Evaluate darwin configuration
        run: nix eval --impure --raw "path:.#darwinConfigurations.default.config.system.build.toplevel.drvPath"

      - name: Validate shell scripts syntax
        run: bash -n scripts/*.sh scripts/lib/*.sh

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh
